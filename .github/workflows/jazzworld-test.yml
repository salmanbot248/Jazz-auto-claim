name: JazzWorld Test

on:
  workflow_dispatch:
    inputs:
      apk_link:
        description: 'Jazz World APK download link'
        required: true

jobs:
  run:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        run: curl -L "${{ github.event.inputs.apk_link }}" -o jazzworld.apk

      - name: Get package name from APK
        id: pkg
        run: |
          PKG=$(aapt dump badging jazzworld.apk | awk -F"'" '/package: name=/{print $2}')
          echo "package=$PKG" >> $GITHUB_OUTPUT
          echo "Detected package: $PKG"

      - name: Emulator - install, launch, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          script: |
            adb install jazzworld.apk
            adb shell monkey -p ${{ steps.pkg.outputs.package }} -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png screenshot.png
            curl -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F "photo=@screenshot.png" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto"
