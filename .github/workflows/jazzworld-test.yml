name: JazzWorld Test

on:
  workflow_dispatch:
    inputs:
      apk_link:
        description: 'Jazz World XAPK download link'
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download and extract XAPK
        run: |
          curl -L "${{ github.event.inputs.apk_link }}" -o jazzworld.xapk
          unzip -o jazzworld.xapk -d xapk_extracted
          find xapk_extracted -name "*.apk"
          cp xapk_extracted/com.jazz.jazzworld.apk jazzworld.apk

      - name: Emulator - install, launch, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: |
            adb install jazzworld.apk
            adb shell monkey -p com.jazz.jazzworld -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png screenshot.png
            curl -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F "photo=@screenshot.png" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto"
